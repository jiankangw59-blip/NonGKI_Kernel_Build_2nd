name: Build Xiaomi Redmi K20 Pro (HyperOS 4.0 A17)

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      root_variant:
        description: "KernelSU 版本和 SUSFS 组合"
        type: choice
        default: bakasu-susfs
        options:
          - bakasu-susfs
          - bakasu
          - sukisu-susfs
          - sukisu
          - next
      zram_compressor:
        description: "ZRAM 默认压缩算法（源码当前为 LZ4）"
        type: choice
        default: source
        options:
          - source
          - lz4
          - zstd
      zram_writeback:
        description: "ZRAM writeback（源码当前开启）"
        type: choice
        default: source
        options:
          - source
          - enabled
          - disabled
      rekernel:
        description: "启用 Re:Kernel 补丁"
        type: boolean
        default: false
      droidspaces:
        description: "启用 Droidspaces（与 SUSFS 同用可能异常）"
        type: boolean
        default: false
      baseband_guard:
        description: "Baseband Guard 保护范围"
        type: choice
        default: disabled
        options:
          - disabled
          - baseband
          - baseband-and-boot
      nomount:
        description: "启用 NoMount 补丁"
        type: boolean
        default: false
      fgetpriority:
        description: "启用 fgetpriority 补丁"
        type: boolean
        default: false
      vpnhide:
        description: "启用 VPNHide 补丁"
        type: boolean
        default: false
      pack_kmodules:
        description: "将本次编译生成的 .ko 加入 AnyKernel3 包"
        type: boolean
        default: false
      build_debugger:
        description: "上传可用的补丁和编译诊断文件"
        type: boolean
        default: false

env:
  ROOT_VARIANT: ${{ inputs.root_variant || 'bakasu-susfs' }}
  ZRAM_COMPRESSOR: ${{ inputs.zram_compressor || 'source' }}
  ZRAM_WRITEBACK: ${{ inputs.zram_writeback || 'source' }}

  # Device env
  DEVICE_NAME : "redmi_k20_pro"
  DEVICE_CODENAME : "raphael"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE : "https://github.com/GengWei1997/Zundamon_kernel_xiaomi_raphael.git"
  KERNEL_BRANCH : "zundamon-evo-public"

  CLANG_SOURCE : "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android17-release/clang-r596125.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "raphael_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true" # if u want easy setting kernelsu, u can true.

  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/GengWei1997/AnyKernel3.git"
  AK3_BRANCH : "raphael-hyperos-a17"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "hyperos_a17"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "AnyKernel3" # Anykernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: ${{ inputs.pack_kmodules == true }}

  KERNELSU_METHOD: "shell" # shell, manual and only.

  PATCHES_SOURCE: "GengWei1997/NonGKI_Kernel_Patches" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "master" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "k20p_hyperos_a17_zundamon" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "susfs_fixed" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: ${{ inputs.rekernel == true }}
  DROIDSPACES_ENABLE: ${{ inputs.droidspaces == true }}
  NOMOUNT_ENABLE: ${{ inputs.nomount == true }}
  FGETPRIORITY_ENABLE: ${{ inputs.fgetpriority == true }}
  VPNHIDE_ENABLE: ${{ inputs.vpnhide == true }}

  HOOK_METHOD: "syscall" # Manual hook method -> syscall.

  KPM_ENABLE: "false" # Anyone devices.
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: ${{ inputs.baseband_guard == 'baseband' || inputs.baseband_guard == 'baseband-and-boot' }}
  BASEBAND_GUARD_BOOT: ${{ inputs.baseband_guard == 'baseband-and-boot' }}

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only Anykernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: ${{ inputs.build_debugger == true }}
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "false" # Merge config files.
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: Build Xiaomi Redmi K20 Pro (HyperOS 4.0 A17)
    runs-on: ubuntu-24.04 # u can changed to ubuntu 22.04, and need container set ubuntu-24.04
    # container: archlinux/archlinux:latest # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Resolve build options
        shell: bash
        run: |
          susfs=false
          case "$ROOT_VARIANT" in
            bakasu-susfs|sukisu-susfs)
              kernelsu="${ROOT_VARIANT%-susfs}"
              susfs=true
              ;;
            bakasu|sukisu|next)
              kernelsu="$ROOT_VARIANT"
              ;;
            *)
              echo "::error::Unsupported KernelSU preset"
              exit 1
              ;;
          esac

          case "$ZRAM_COMPRESSOR" in
            source|lz4|zstd) ;;
            *) echo "::error::Unsupported ZRAM compressor"; exit 1 ;;
          esac
          case "$ZRAM_WRITEBACK" in
            source|enabled|disabled) ;;
            *) echo "::error::Unsupported ZRAM writeback mode"; exit 1 ;;
          esac

          {
            echo "KERNELSU_AUTO_FORK=$kernelsu"
            echo "SUSFS_ENABLE=$susfs"
          } >> "$GITHUB_ENV"
          printf 'KernelSU=%s SUSFS=%s ZRAM compressor=%s ZRAM writeback=%s\n' \
            "$kernelsu" "$susfs" "$ZRAM_COMPRESSOR" "$ZRAM_WRITEBACK"

      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: Configure ZRAM overrides
        if: env.ZRAM_COMPRESSOR != 'source' || env.ZRAM_WRITEBACK != 'source'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          defconfig="arch/$KERNEL_ARCH/configs/$DEFCONFIG_NAME"

          if [[ "$ZRAM_COMPRESSOR" != source ]]; then
            compressor="${ZRAM_COMPRESSOR^^}"
            while IFS= read -r symbol; do
              scripts/config --file "$defconfig" --undefine "$symbol"
            done < <(sed -n 's/^config \(ZRAM_DEF_COMP_[A-Z0-9_]*\)$/\1/p' drivers/block/zram/Kconfig)
            scripts/config --file "$defconfig" --enable ZRAM \
              --enable "ZRAM_BACKEND_$compressor" --enable "ZRAM_DEF_COMP_$compressor"
          fi

          case "$ZRAM_WRITEBACK" in
            enabled) scripts/config --file "$defconfig" --enable ZRAM --enable ZRAM_WRITEBACK ;;
            disabled) scripts/config --file "$defconfig" --disable ZRAM_WRITEBACK ;;
          esac

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: ⛔ Patch Kernel of fgetpriority
        uses: ./.github/workflows/patch-fgetpriority

      - name: 🛜 Patch Kernel of VPNHide
        uses: ./.github/workflows/patch-vpnhide

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: Verify requested ZRAM configuration
        if: env.ZRAM_COMPRESSOR != 'source' || env.ZRAM_WRITEBACK != 'source'
        shell: bash
        run: |
          config="$GITHUB_WORKSPACE/device_kernel/out/.config"
          if [[ "$ZRAM_COMPRESSOR" != source ]]; then
            grep -Fx "CONFIG_ZRAM_DEF_COMP=\"$ZRAM_COMPRESSOR\"" "$config"
          fi
          case "$ZRAM_WRITEBACK" in
            enabled) grep -Fx 'CONFIG_ZRAM_WRITEBACK=y' "$config" ;;
            disabled) grep -Fx '# CONFIG_ZRAM_WRITEBACK is not set' "$config" ;;
          esac

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
