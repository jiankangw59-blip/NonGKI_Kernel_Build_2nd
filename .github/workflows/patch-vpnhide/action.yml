name: 'Patch VPNHide for Kernel.'

runs:
  using: 'composite'
  steps:
      - name: Patch VPNHide
        if: env.VPNHIDE_ENABLE == 'true'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"

          if ! grep -Fq 'source "security/vpnhide/Kconfig"' security/Kconfig; then
            git clone https://github.com/soranerai/vpnhide_next_backend.git vpnhide
            case "$KERNEL_VERSION" in
              5.4) profile=android12-5.4 ;;
              4.19|4.14|4.9) profile="upstream-$KERNEL_VERSION" ;;
              *) echo "::error::VPNHide does not support kernel $KERNEL_VERSION"; exit 1 ;;
            esac
            bash vpnhide/kpatch/scripts/apply.sh . "$profile"
            if ! grep -Fq 'source "security/vpnhide/Kconfig"' security/Kconfig; then
              printf '\nsource "security/vpnhide/Kconfig"\n' >> security/Kconfig
            fi
          fi

          if ! grep -Fq 'vpnhide/' security/Makefile; then
            printf '\nobj-$(CONFIG_VPNHIDE) += vpnhide/\n' >> security/Makefile
          fi

          scripts/config --file "arch/$KERNEL_ARCH/configs/$DEFCONFIG_NAME" --enable VPNHIDE
          echo "[+] VPNHide enabled."
